<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LessFun — Ten games. Zero guarantees.</title>
  <meta name="description" content="LessFun is a tiny arcade of ten questionable browser games. Tap, guess, flip, and waste a few minutes.">
  <meta name="theme-color" content="#0a0712">
  <meta name="color-scheme" content="dark">
  <meta property="og:title" content="LessFun">
  <meta property="og:description" content="Ten games. Zero guarantees.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="orb orb-one"></span>
    <span class="orb orb-two"></span>
    <span class="orb orb-three"></span>
    <span class="grain"></span>
  </div>

  <div class="page">
    <header class="site-header" id="site-header">
      <div class="brand">
        <div class="brand-title">
          <h1 class="wordmark">LessFun</h1>
          <span class="wordmark-spark" aria-hidden="true"></span>
        </div>
        <p class="tagline">Ten games. Zero guarantees.</p>
        <div class="badge-row" aria-label="Site facts">
          <span class="badge"><span class="badge-dot"></span>10 games</span>
          <span class="badge badge-muted">No downloads</span>
        </div>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <footer class="site-footer">
      <span>Built for fun. Mostly.</span>
      <span class="footer-mark">LF</span>
    </footer>
  </div>

  <div id="modal-root" class="modal-root" aria-live="polite"></div>

  <noscript>
    <div class="noscript">LessFun needs JavaScript to run. Please enable it and reload.</div>
  </noscript>

  <script defer src="js/base.js"></script>
  <script defer src="js/games-arcade.js"></script>
  <script defer src="js/games-puzzle.js"></script>
  <script defer src="js/games-luck.js"></script>
  <script defer src="js/games-versus.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>

<script>
  if (!sessionStorage.getItem('lf-credits-shown')) {
    alert("Hey, this website is owned by Mason Wong. Inspiration was from a guy named AJ.");
    sessionStorage.setItem('lf-credits-shown', '1');
  }
</script>
