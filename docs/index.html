<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LessFun</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>LessFun</h1>
            <p class="subtitle">Ten games. Zero guarantees.</p>
        </header>
        <div id="gameList" class="game-list"></div>
        <div id="gameView" class="game-view" style="display: none;">
            <button onclick="showList()" class="back-btn">← Back</button>
            <h2 id="gameTitle"></h2>
            <div id="gameContent"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
